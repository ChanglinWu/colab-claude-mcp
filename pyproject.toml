[project]
name = "colab-claude-mcp"
version = "0.7.1"
description = "An MCP server that lets Claude drive a Google Colab notebook (persistent tab, live mirror page), a JupyterLab notebook through a logged-in tab (for example on an HPC) and a local MATLAB session"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tyler Pirtle", email = "rtp@google.com" },
    { name = "Josie Cuff", email = "josiecuff@google.com" },
]
maintainers = [{ name = "ChanglinWu" }]
requires-python = ">=3.13"
dependencies = [
    "fastmcp==2.14.5",
    "httpx>=0.27",
    "mcp>=1.20.0",
    "pydantic>=2.12.3,<3.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=15.0.1",
]

[project.scripts]
colab-claude-mcp = "colab_claude_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.3",
]
commit = [
    "pre-commit>=4.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
url = "https://pypi.org/simple"
