<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATLAB output</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --line: #dfddd5; --text: #1f1e1b; --muted: #6f6c63;
    --code-bg: #fbfaf7; --accent: #b4540a; --ok: #2f7d4f; --bad: #b3261e; --run: #b4540a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --surface: #1f2024; --line: #33353b; --text: #e8e6e1; --muted: #9a978f;
      --code-bg: #1a1b1f; --accent: #f0a04b; --ok: #6cc08b; --bad: #f2867f; --run: #f0a04b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .on .dot { background: var(--ok); } .off .dot { background: var(--bad); }
  .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
  label.follow { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  a.nav { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  a.nav:hover { text-decoration: underline; }
  main { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .cell { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; margin-bottom: 12px; scroll-margin-top: 56px; }
  .gutter { font: 12px var(--mono); color: var(--muted); padding-top: 9px; text-align: right; }
  .gutter .state { display: block; margin-top: 3px; font-family: var(--sans); font-size: 11px; }
  .running .state { color: var(--run); font-weight: 600; }
  .finished .state, .ended .state { color: var(--ok); }
  .failed .state, .lost .state { color: var(--bad); font-weight: 600; }
  .interrupted .state { color: var(--muted); font-weight: 600; }
  .body { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .running .body { border-color: var(--run); box-shadow: 0 0 0 1px var(--run); }
  .failed .body, .lost .body { border-color: var(--bad); }
  .caption { font: 12px var(--mono); color: var(--muted); padding: 7px 12px 0; background: var(--code-bg); overflow-wrap: anywhere; }
  .caption:empty { display: none; }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
  .source { padding: 9px 12px; background: var(--code-bg); max-height: 320px; overflow: auto; }
  .outputs { border-top: 1px solid var(--line); padding: 9px 12px; display: grid; gap: 8px; }
  .outputs:empty { display: none; }
  .outputs pre { max-height: 420px; overflow: auto; }
  .outputs .stderr { color: var(--muted); }
  .outputs .err { color: var(--bad); }
  .outputs .note { margin: 0; color: var(--muted); font-size: 12px; }
  .outputs img { max-width: 100%; max-height: calc(100vh - 90px); width: auto; height: auto; object-fit: contain;
    background: #fff; border-radius: 4px; display: block; cursor: zoom-in; }
  .outputs img.full { max-height: none; cursor: zoom-out; }
  @media (max-width: 560px) { .cell { grid-template-columns: 1fr; gap: 2px; } .gutter { text-align: left; padding-top: 0; }
    .gutter .state { display: inline; margin-left: 8px; } }
  @media (prefers-reduced-motion: no-preference) {
    .running .state::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--run); margin-right: 5px; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  }
</style>
</head>
<body>
<header>
  <h1>MATLAB output</h1>
  <span id="sess" class="pill off"><span class="dot"></span><span id="sess-text">Connecting…</span></span>
  <span id="meta" class="meta"></span>
  <label class="follow"><input id="follow" type="checkbox" checked> Follow newest run</label>
  <a class="nav" href="/">Colab mirror</a>
</header>
<main id="runs"><p class="empty">Waiting for the hub…</p></main>
<script>
const runsEl = document.getElementById("runs");
const followEl = document.getElementById("follow");
const known = new Map(); // id -> {el, rev, status, started, finished, scroll}
let skew = 0, newestId = null, newestStatus = null;
// The run being followed. Figures load after the scroll and push it down, so for a few seconds
// each loaded figure scrolls to it again, until the user scrolls the page themselves.
let follow = null;
function refollow() {
  if (follow && followEl.checked && Date.now() < follow.until) follow.el.scrollIntoView({block: "start"});
}
for (const type of ["wheel", "touchmove", "keydown", "mousedown"]) {
  addEventListener(type, () => { follow = null; }, {passive: true});
}
const LABELS = {running: "running", finished: "done", ended: "done", failed: "error", interrupted: "interrupted",
  lost: "lost"};

function fmt(seconds) {
  if (seconds < 60) return seconds.toFixed(seconds < 10 ? 1 : 0) + " s";
  return Math.floor(seconds / 60) + " min " + Math.round(seconds % 60) + " s";
}

function clock(t) {
  return new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23"});
}

function release(text) {
  const match = /\((R\d{4}[ab])\)\s*(.*)$/.exec(text || "");
  return match ? (match[1] + " " + match[2]).trim() : (text || "");
}

function makeRun(run) {
  const el = document.createElement("section");
  el.dataset.id = run.id;
  el.innerHTML = '<div class="gutter"><span class="idx"></span><span class="state"></span></div>' +
    '<div class="body"><div class="caption"></div><pre class="source"></pre><div class="outputs"></div></div>';
  el.querySelector(".idx").textContent = run.started ? clock(run.started) : "";
  el.querySelector(".idx").title = run.id;
  el.querySelector(".source").textContent = run.label || " ";
  return {el, rev: null, status: null, scroll: false};
}

function block(tag, text, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.textContent = text;
  return node;
}

async function loadRun(run, entry) {
  try {
    const response = await fetch("/matlab/run/" + encodeURIComponent(run.id), {cache: "no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    entry.el.querySelector(".caption").textContent = data.kind === "script" && data.script ? "script " + data.script : "";
    entry.el.querySelector(".source").textContent = data.code || data.label || " ";
    const items = [];
    if (data.output && data.output.trim()) items.push(block("pre", data.output.replace(/\s+$/, ""), ""));
    if (data.stderr && data.stderr.trim()) items.push(block("pre", data.stderr, "stderr"));
    if (data.error) items.push(block("pre", data.error, "err"));
    (data.figures || []).forEach((name, n) => {
      const img = document.createElement("img");
      img.src = "/matlab/file/" + encodeURIComponent(name);
      img.alt = "Figure " + (n + 1) + " of " + run.id;
      img.title = "Click to toggle full size";
      img.addEventListener("click", () => img.classList.toggle("full"));
      img.addEventListener("load", refollow);
      items.push(img);
    });
    if (data.note) items.push(block("p", data.note, "note"));
    if (data.status === "running") {
      items.push(block("p", "Running. MATLAB hands over printed output and figures when the run ends.", "note"));
    }
    entry.el.querySelector(".outputs").replaceChildren(...items);
    if (entry.scroll && followEl.checked) {
      entry.el.scrollIntoView({block: "start", behavior: "smooth"});
      follow = {el: entry.el, until: Date.now() + 4000};
    }
    entry.scroll = false;
  } catch (e) {
    entry.rev = null; // try again on the next tick
  }
}

function render(state) {
  skew = Date.now() / 1000 - state.now;
  const session = state.session || {};
  document.getElementById("sess").className = "pill " + (session.running ? "on" : "off");
  document.getElementById("sess-text").textContent = session.running ?
    ["MATLAB running", session.mode, release(session.release)].filter(Boolean).join(" · ") : "MATLAB not running";
  const running = state.runs.filter((run) => run.status === "running").length;
  document.getElementById("meta").textContent = [
    state.runs.length + (state.runs.length === 1 ? " run" : " runs"), running ? running + " running" : ""
  ].filter(Boolean).join(" · ");

  if (!state.runs.length) {
    known.clear();
    runsEl.innerHTML = '<p class="empty">No MATLAB runs yet. Ask Claude to run something in MATLAB.</p>';
    return;
  }
  const ids = state.runs.map((run) => run.id);
  for (const id of [...known.keys()]) if (!ids.includes(id)) { known.get(id).el.remove(); known.delete(id); }
  for (const run of state.runs) if (!known.has(run.id)) known.set(run.id, makeRun(run));
  const current = [...runsEl.children].map((el) => el.dataset.id);
  if (current.join("\n") !== ids.join("\n")) runsEl.replaceChildren(...ids.map((id) => known.get(id).el));

  const newest = state.runs[state.runs.length - 1];
  if (newest.id !== newestId || newest.status !== newestStatus) {
    known.get(newest.id).scroll = true;
    newestId = newest.id; newestStatus = newest.status;
  }
  for (const run of state.runs) {
    const entry = known.get(run.id);
    entry.el.className = "cell " + run.status;
    entry.status = run.status; entry.started = run.started; entry.finished = run.finished;
    if (entry.rev !== run.rev) { entry.rev = run.rev; loadRun(run, entry); }
  }
  updateTimers();
}

function updateTimers() {
  const now = Date.now() / 1000 - skew;
  for (const entry of known.values()) {
    let label = LABELS[entry.status] || entry.status || "";
    if (entry.started && entry.status !== "lost") label += " " + fmt((entry.finished || now) - entry.started);
    entry.el.querySelector(".state").textContent = label.trim();
  }
}

async function tick() {
  try {
    render(await (await fetch("/matlab/state", {cache: "no-store"})).json());
  } catch (e) {
    document.getElementById("sess").className = "pill off";
    document.getElementById("sess-text").textContent = "Hub not running";
  }
}
tick();
setInterval(tick, 1000);
setInterval(updateTimers, 250);
</script>
</body>
</html>
