<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATLAB output</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --line: #dfddd5; --text: #1f1e1b; --muted: #6f6c63;
    --code-bg: #fbfaf7; --accent: #b4540a; --accent-soft: #f4e6d9; --ok: #2f7d4f; --bad: #b3261e; --run: #b4540a;
    --warn: #8f6200;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --surface: #1f2024; --line: #33353b; --text: #e8e6e1; --muted: #9a978f;
      --code-bg: #1a1b1f; --accent: #f0a04b; --accent-soft: #3b2d20; --ok: #6cc08b; --bad: #f2867f; --run: #f0a04b;
      --warn: #e0b54a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  /* Header: the same page switcher as the notebook mirrors. */
  header.top { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
  .row { max-width: 980px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
  .appbar { padding-top: 8px; padding-bottom: 4px; }
  .docbar { padding-bottom: 9px; }
  nav.views { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); flex: none; }
  nav.views a { padding: 2px 11px; border-radius: 6px; font-size: 12.5px; line-height: 20px; color: var(--muted);
    text-decoration: none; }
  nav.views a:hover { color: var(--text); }
  nav.views a[aria-current="page"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; min-width: 0;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
  .pill > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .on .dot { background: var(--ok); } .off .dot { background: var(--bad); }
  .doc { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .doc-name { font-size: 15px; font-weight: 650; white-space: nowrap; }
  .doc-where { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  label.follow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none; white-space: nowrap; flex: none; }
  label.follow input { appearance: none; position: relative; width: 26px; height: 15px; margin: 0; border-radius: 999px;
    background: var(--line); cursor: pointer; flex: none; }
  label.follow input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  label.follow input:checked { background: var(--accent); }
  label.follow input:checked::after { transform: translateX(11px); }
  label.follow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    label.follow input, label.follow input::after { transition: background .15s, transform .15s; }
  }
  main { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .cell { margin-bottom: 12px; scroll-margin-top: 100px; }
  /* No side column: start time, tag and run time sit in the top right corner of the run's code. */
  .badge { float: right; display: flex; align-items: center; gap: 5px; margin: 0 0 2px 12px;
    font: 11px/16px var(--mono); color: var(--muted); white-space: nowrap; }
  .tag { font: 600 10.5px/16px var(--sans); padding: 0 5px; border-radius: 4px; cursor: default;
    background: color-mix(in srgb, currentColor 13%, transparent); }
  .tag:empty, .time:empty { display: none; }
  .t-run { color: var(--run); } .t-err { color: var(--bad); } .t-warn { color: var(--warn); }
  .t-out, .t-stop { color: var(--muted); } .t-done { color: var(--ok); }
  .t-run::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%;
    background: currentColor; vertical-align: 1px; }
  .time { font: 10.5px/1 var(--sans); font-variant-numeric: tabular-nums; }
  .body { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .running .body { border-color: var(--run); box-shadow: 0 0 0 1px var(--run); }
  .failed .body, .lost .body { border-color: var(--bad); }
  .caption { font: 12px var(--mono); color: var(--muted); padding: 7px 12px 0; background: var(--code-bg); overflow-wrap: anywhere; }
  .caption:empty { display: none; }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
  .source { padding: 9px 12px; background: var(--code-bg); max-height: 320px; overflow: auto; }
  .outputs { border-top: 1px solid var(--line); padding: 9px 12px; display: grid; gap: 8px; }
  .outputs:empty { display: none; }
  .outputs pre { max-height: 420px; overflow: auto; }
  .outputs .stderr { color: var(--muted); }
  .outputs .err { color: var(--bad); }
  .outputs .note { margin: 0; color: var(--muted); font-size: 12px; }
  .outputs img { max-width: 100%; max-height: calc(100vh - 90px); width: auto; height: auto; object-fit: contain;
    background: #fff; border-radius: 4px; display: block; cursor: zoom-in; }
  .outputs img.full { max-height: none; cursor: zoom-out; }
  .outputs a.file { font-size: 12px; color: var(--accent); text-decoration: none; justify-self: start; margin-top: -4px; }
  .outputs a.file:hover { text-decoration: underline; }
  @media (max-width: 720px) { .row { padding-left: 12px; padding-right: 12px; } main { padding: 12px 12px 40px; } }
  @media (prefers-reduced-motion: no-preference) {
    .t-run::before { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  }
</style>
</head>
<body>
<header class="top">
  <div class="row appbar">
    <nav class="views" aria-label="Pages">
      <a href="/" data-view="colab">Colab</a>
      <a href="/jupyter/" data-view="jupyter">Jupyter</a>
      <a href="/matlab" data-view="matlab" aria-current="page">MATLAB</a>
    </nav>
    <div class="status">
      <label class="follow" title="Scroll to the newest run"><input id="follow" type="checkbox" checked>Follow</label>
      <span id="sess" class="pill off" role="status"><span class="dot"></span><span id="sess-text">Connecting…</span></span>
    </div>
  </div>
  <div class="row docbar">
    <div class="doc"><span class="doc-name">MATLAB output</span><span id="meta" class="doc-where"></span></div>
  </div>
</header>
<main id="runs"><p class="empty">Waiting for the hub…</p></main>
<script>
const runsEl = document.getElementById("runs");
const followEl = document.getElementById("follow");
const known = new Map(); // id -> {el, rev, status, started, finished, scroll}
let skew = 0, newestId = null, newestStatus = null;
// The run being followed. Figures load after the scroll and push it down, so for a few seconds
// each loaded figure scrolls to it again, until the user scrolls the page themselves.
let follow = null;
function refollow() {
  if (follow && followEl.checked && Date.now() < follow.until) follow.el.scrollIntoView({block: "start"});
}
for (const type of ["wheel", "touchmove", "keydown", "mousedown"]) {
  addEventListener(type, () => { follow = null; }, {passive: true});
}
function fmt(seconds) {
  if (seconds < 60) return seconds.toFixed(seconds < 10 ? 1 : 0) + " s";
  return Math.floor(seconds / 60) + " min " + Math.round(seconds % 60) + " s";
}

function short(seconds) { // for the badge: 5.6s, 42s, 12m05s, 1h02m
  if (seconds < 10) return seconds.toFixed(1) + "s";
  if (seconds < 60) return Math.floor(seconds) + "s";
  const pad = (n) => String(Math.floor(n)).padStart(2, "0");
  if (seconds < 3600) return Math.floor(seconds / 60) + "m" + pad(seconds % 60) + "s";
  return Math.floor(seconds / 3600) + "h" + pad((seconds % 3600) / 60) + "m";
}

// The same short tags as the notebook mirrors, plus Stop for an interrupted run.
const TAGS = {
  run: {text: "Run", tip: (t) => "Running" + (t ? " for " + t : "")},
  err: {text: "Err", tip: (t, run) => (run.status === "lost" ? "Lost: MATLAB stopped during the run" : "Error") +
    (t ? " after " + t : "")},
  stop: {text: "Stop", tip: (t) => "Interrupted" + (t ? " after " + t : "")},
  warn: {text: "Warn", tip: (t) => "Finished with warnings" + (t ? " in " + t : "")},
  out: {text: "Out", tip: (t) => "Finished" + (t ? " in " + t : "") + ", with output"},
  done: {text: "Done", tip: (t) => "Finished" + (t ? " in " + t : "") + ", no output"},
};

function tagOf(run) {
  if (run.status === "running") return "run";
  if (run.status === "failed" || run.status === "lost" || run.error) return "err";
  if (run.status === "interrupted") return "stop";
  if (run.warn) return "warn";
  return run.out ? "out" : "done";
}

function clock(t) {
  return new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23"});
}

function release(text) {
  const match = /\((R\d{4}[ab])\)\s*(.*)$/.exec(text || "");
  return match ? (match[1] + " " + match[2]).trim() : (text || "");
}

function makeRun(run) {
  const el = document.createElement("section");
  el.dataset.id = run.id;
  // The badge floats inside the code, which scrolls on its own, so the code still gets the full width.
  el.innerHTML = '<div class="body"><div class="caption"></div><pre class="source"><span class="badge">' +
    '<span class="idx"></span><span class="tag"></span><span class="time"></span></span><span class="code"></span></pre>' +
    '<div class="outputs"></div></div>';
  el.querySelector(".idx").textContent = run.started ? clock(run.started) : "";
  el.querySelector(".idx").title = run.id;
  el.querySelector(".code").textContent = run.label || " ";
  return {el, run, rev: null, status: null, tag: null, scroll: false};
}

function block(tag, text, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.textContent = text;
  return node;
}

async function loadRun(run, entry) {
  try {
    const response = await fetch("/matlab/run/" + encodeURIComponent(run.id), {cache: "no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    entry.el.querySelector(".caption").textContent = data.kind === "script" && data.script ? "script " + data.script : "";
    entry.el.querySelector(".code").textContent = data.code || data.label || " ";
    const items = [];
    if (data.output && data.output.trim()) items.push(block("pre", data.output.replace(/\s+$/, ""), ""));
    if (data.stderr && data.stderr.trim()) items.push(block("pre", data.stderr, "stderr"));
    if (data.error) items.push(block("pre", data.error, "err"));
    (data.figures || []).forEach((name, n) => {
      const img = document.createElement("img");
      img.src = "/matlab/file/" + encodeURIComponent(name);
      img.alt = "Figure " + (n + 1) + " of " + run.id;
      img.title = "Click to toggle full size";
      img.addEventListener("click", () => img.classList.toggle("full"));
      img.addEventListener("load", refollow);
      items.push(img);
      const pdf = name.replace(/\.png$/, ".pdf");
      if ((data.pdfs || []).includes(pdf)) {
        const link = document.createElement("a");
        link.className = "file";
        link.href = "/matlab/file/" + encodeURIComponent(pdf);
        link.download = pdf; // Claude's built-in browser downloads PDFs anyway; say so up front
        link.textContent = "Download vector PDF (figure " + (n + 1) + ")";
        items.push(link);
      }
    });
    if (data.note) items.push(block("p", data.note, "note"));
    if (data.status === "running") {
      items.push(block("p", "Running. MATLAB hands over printed output and figures when the run ends.", "note"));
    }
    entry.el.querySelector(".outputs").replaceChildren(...items);
    if (entry.scroll && followEl.checked) {
      entry.el.scrollIntoView({block: "start", behavior: "smooth"});
      follow = {el: entry.el, until: Date.now() + 4000};
    }
    entry.scroll = false;
  } catch (e) {
    entry.rev = null; // try again on the next tick
  }
}

function render(state) {
  skew = Date.now() / 1000 - state.now;
  const session = state.session || {};
  document.getElementById("sess").className = "pill " + (session.running ? "on" : "off");
  document.getElementById("sess-text").textContent = session.running ?
    ["MATLAB running", session.mode, release(session.release)].filter(Boolean).join(" · ") : "MATLAB not running";
  const running = state.runs.filter((run) => run.status === "running").length;
  document.getElementById("meta").textContent = [
    state.runs.length + (state.runs.length === 1 ? " run" : " runs"), running ? running + " running" : ""
  ].filter(Boolean).join(" · ");

  if (!state.runs.length) {
    known.clear();
    runsEl.innerHTML = '<p class="empty">No MATLAB runs yet. Ask Claude to run something in MATLAB.</p>';
    return;
  }
  const ids = state.runs.map((run) => run.id);
  for (const id of [...known.keys()]) if (!ids.includes(id)) { known.get(id).el.remove(); known.delete(id); }
  for (const run of state.runs) if (!known.has(run.id)) known.set(run.id, makeRun(run));
  const current = [...runsEl.children].map((el) => el.dataset.id);
  if (current.join("\n") !== ids.join("\n")) runsEl.replaceChildren(...ids.map((id) => known.get(id).el));

  const newest = state.runs[state.runs.length - 1];
  if (newest.id !== newestId || newest.status !== newestStatus) {
    known.get(newest.id).scroll = true;
    newestId = newest.id; newestStatus = newest.status;
  }
  for (const run of state.runs) {
    const entry = known.get(run.id);
    entry.el.className = "cell " + run.status;
    const tag = tagOf(run);
    if (entry.tag !== tag) {
      const el = entry.el.querySelector(".tag");
      el.className = "tag t-" + tag;
      el.textContent = TAGS[tag].text;
      entry.tag = tag;
    }
    entry.run = run;
    entry.status = run.status; entry.started = run.started; entry.finished = run.finished;
    if (entry.rev !== run.rev) { entry.rev = run.rev; loadRun(run, entry); }
  }
  updateTimers();
}

function updateTimers() {
  const now = Date.now() / 1000 - skew;
  for (const entry of known.values()) {
    const seconds = entry.started && entry.status !== "lost" ? Math.max(0, (entry.finished || now) - entry.started) : null;
    const time = seconds === null ? "" : short(seconds);
    const timeEl = entry.el.querySelector(".time");
    if (timeEl.textContent !== time) timeEl.textContent = time;
    if (entry.tag) entry.el.querySelector(".tag").title = TAGS[entry.tag].tip(seconds === null ? "" : fmt(seconds), entry.run);
  }
}

async function tick() {
  try {
    render(await (await fetch("/matlab/state", {cache: "no-store"})).json());
  } catch (e) {
    document.getElementById("sess").className = "pill off";
    document.getElementById("sess-text").textContent = "Hub not running";
  }
}
tick();
setInterval(tick, 1000);
setInterval(updateTimers, 250);
</script>
</body>
</html>
