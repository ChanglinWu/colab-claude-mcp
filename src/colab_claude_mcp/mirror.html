    </nav>
    <div class="status">
      <a id="connect" class="action" href="/jupyter/setup" hidden>Connect a JupyterLab tab</a>
      <label class="follow" title="Scroll to the cell that is running"><input id="follow" type="checkbox" checked>Follow</label>
      <span id="conn" class="pill off" role="status"><span class="dot"></span><span id="conn-text">Connecting…</span></span>
    </div>
  </div>
  <div class="row docbar">

      <span id="doc-name" class="doc-name none">No notebook open</span>
      <span id="doc-where" class="doc-where"></span>
    </div>
    <div class="facts">
      <span id="kernel" class="chip" hidden><span class="dot"></span><span id="kernel-text"></span></span>
      <span id="count" class="chip" hidden><span></span></span>
    </div>
  </div>
</header>
<main id="cells"><p class="empty">Waiting for the hub…</p></main>
<details class="activity"><summary>Activity</summary><ul id="log"></ul></details>
<script src="/vendor/marked-18.2.0/marked.umd.js"></script>

<script>
// The same page mirrors the Colab notebook (at /) and the JupyterLab one (at /jupyter/).
const VIEW = location.pathname.startsWith("/jupyter") ? "jupyter" : "colab";
const KINDS = {
  colab: {tab: "Colab tab", empty: "No notebook yet. Ask Claude to connect to Colab."},
  jupyter: {tab: "JupyterLab tab", empty: "No notebook yet. Ask Claude to connect to JupyterLab.", setup: true},
};
const KIND = KINDS[VIEW];
const BASE_TITLE = document.title;
const $ = (id) => document.getElementById(id);
const ui = {
  cells: $("cells"), conn: $("conn"), connText: $("conn-text"), connect: $("connect"), name: $("doc-name"),
  where: $("doc-where"), kernel: $("kernel"), kernelText: $("kernel-text"), count: $("count"), follow: $("follow"),
  log: $("log"),
};
document.querySelector('nav.views a[data-view="' + VIEW + '"]').setAttribute("aria-current", "page");
const known = new Map(); // id -> {el, cell, source, type, rev, status, started, finished, tag, showSource}
let skew = 0, lastRev = -1;

function fmt(seconds) {
  if (seconds < 60) return seconds.toFixed(seconds < 10 ? 1 : 0) + " s";
  return Math.floor(seconds / 60) + " min " + Math.round(seconds % 60) + " s";
}

function short(seconds) { // for the badge: 5.6s, 42s, 12m05s, 1h02m
  if (seconds < 10) return seconds.toFixed(1) + "s";
  if (seconds < 60) return Math.floor(seconds) + "s";
  const pad = (n) => String(Math.floor(n)).padStart(2, "0");
  if (seconds < 3600) return Math.floor(seconds / 60) + "m" + pad(seconds % 60) + "s";
  return Math.floor(seconds / 3600) + "h" + pad((seconds % 3600) / 60) + "m";
}

// A code cell's tag, most important first: running, error, warnings (stderr), output, finished.
const TAGS = {
  run: {text: "Run", tip: (t) => "Running" + (t ? " for " + t : "")},
  err: {text: "Err", tip: (t, cell) => (cell.status === "failed" ? "Could not run" : "Error") + (t ? " after " + t : "")},
  warn: {text: "Warn", tip: (t) => "Finished with warnings on stderr" + (t ? " in " + t : "")},
  out: {text: "Out", tip: (t) => (t ? "Finished in " + t + ", with output" : "Has output from an earlier run")},
  done: {text: "Done", tip: (t) => "Finished" + (t ? " in " + t : "") + ", no output"},
};

function tagOf(cell) {
  if (cell.type !== "code") return null;
  if (cell.status === "running") return "run";
  if (cell.status === "error" || cell.status === "failed" || cell.error) return "err";
  if (cell.warn) return "warn";
  if (cell.outputs) return "out";
  return cell.status === "done" ? "done" : null;
}

// ---- Markdown and math, rendered the way JupyterLab does it --------------------------------------
// The math is taken out before the Markdown parser runs (it would eat backslashes and underscores),
// the HTML is sanitized, and the math is put back typeset by KaTeX. removeMath follows JupyterLab's
// packages/rendermime/src/latex.ts (from MathJax and StackExchange code, Apache-2.0).
const MATHSPLIT = /(\$\$?|\\(?:begin|end)\{[a-z]*\*?\}|\\[{}$]|[{}]|(?:\n\s*)+|@@\d+@@|\\\\(?:\(|\)|\[|\]))/i;

function removeMath(text) {
  const math = [];
  let start = null, end = null, last = null, braces = 0;
  let deTilde = (s) => s;
  if (text.includes("`") || text.includes("~~~")) { // no math inside code spans and fences
    text = text.replace(/~/g, "~T")
      .replace(/^(?<fence>`{3,}|(~T){3,})[^`\n]*\n([\s\S]*?)^\k<fence>`*$/gm, (whole) => whole.replace(/\$/g, "~D"))
      .replace(/(^|[^\\])(`+)([^\n]*?[^`\n])\2(?!`)/gm, (whole) => whole.replace(/\$/g, "~D"));
    deTilde = (s) => s.replace(/~([TD])/g, (whole, c) => (c === "T" ? "~" : "$"));
  }
  const blocks = text.replace(/\r\n?/g, "\n").split(MATHSPLIT);
  const take = (i, j) => {
    const block = deTilde(blocks.slice(i, j + 1).join(""));
    for (let k = j; k > i; k--) blocks[k] = "";
    blocks[i] = "@@" + math.length + "@@";
    math.push(block);
  };
  for (let i = 1, m = blocks.length; i < m; i += 2) {
    const block = blocks[i];
    if (block.charAt(0) === "@") { // a marker that was already in the text: keep it as it is
      blocks[i] = "@@" + math.length + "@@";
      math.push(block);
    } else if (start !== null) { // in math: find the end, balance braces, stop at a blank line
      if (block === end) {
        if (braces) last = i;
        else { take(start, i); start = end = last = null; }
      } else if (/\n.*\n/.test(block)) {
        if (last !== null) { i = last; take(start, i); }
        start = end = last = null;
        braces = 0;
      } else if (block === "{") braces++;
      else if (block === "}" && braces) braces--;
    } else if (block === "$" || block === "$$") {
      start = i; end = block; braces = 0;
    } else if (block === "\\\\(" || block === "\\\\[") {
      start = i; end = block.slice(-1) === "(" ? "\\\\)" : "\\\\]"; braces = 0;
    } else if (block.substr(1, 5) === "begin") {
      start = i; end = "\\end" + block.substr(6); braces = 0;
    }
  }
  if (start !== null && last !== null) take(start, last);
  return {text: deTilde(blocks.join("")), math};
}

function mathParts(raw) {
  if (raw.length >= 4 && raw.startsWith("$$") && raw.endsWith("$$")) return {tex: raw.slice(2, -2), display: true};
  if (raw.length >= 2 && raw.startsWith("$") && raw.endsWith("$")) return {tex: raw.slice(1, -1), display: false};
  if (raw.startsWith("\\\\(") && raw.endsWith("\\\\)")) return {tex: raw.slice(3, -3), display: false};
  if (raw.startsWith("\\\\[") && raw.endsWith("\\\\]")) return {tex: raw.slice(3, -3), display: true};
  if (raw.startsWith("\\begin{")) return {tex: raw, display: true};
  return null; // a literal @@n@@ from the text
}

const MACROS = {}; // \newcommand and \def carry over to later cells, as with MathJax in JupyterLab
const KATEX = {throwOnError: false, output: "htmlAndMathml", trust: false, strict: "ignore", macros: MACROS,
  globalGroup: true, maxSize: 50, maxExpand: 1000};

function typeset(tex, display) {
  // Like MathJax in JupyterLab: no automatic equation numbers (\tag still works), \label is ignored.
  tex = tex.replace(/\\label\{[^{}]*\}/g, "").replace(/\\(begin|end)\{(equation|align|alignat|gather)\}/g, "\\$1{$2*}");
  const options = {...KATEX, displayMode: display, throwOnError: true};
  for (let tries = 0; tries < 20; tries++) {
    try {
      return katex.renderToString(tex, options);
    } catch (error) {
      // MathJax lets \newcommand redefine a command, KaTeX wants \renewcommand: KaTeX has its own \R, and a
      // cell that is shown again defines its commands again. Switch only the command KaTeX names.
      const name = /attempting to redefine (\\[A-Za-z@]+|\\.)/.exec(String(error && error.message));
      if (!name) break;
      const quoted = name[1].replace(/[\\^$.*+?()[\]{}|]/g, "\\$&");
      const fixed = tex.replace(new RegExp("\\\\newcommand(\\s*\\{\\s*" + quoted + "\\s*\\}|\\s*" + quoted + "(?![A-Za-z@]))"),
        "\\renewcommand$1");
      if (fixed === tex) break;
      tex = fixed;
    }
  }
  return katex.renderToString(tex, {...options, throwOnError: false});
}

function mathNode(raw) {
  const parts = mathParts(raw);
  if (!parts || !window.katex) return document.createTextNode(raw);
  const span = document.createElement("span");
  try {
    span.innerHTML = typeset(parts.tex, parts.display);
  } catch (error) {
    span.className = "math-error";
    span.textContent = raw;
    span.title = String((error && error.message) || error);
  }
  return span;
}

function restoreMath(root, math) {
  if (!math.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  for (let node = walker.nextNode(); node; node = walker.nextNode()) if (node.nodeValue.includes("@@")) nodes.push(node);
  for (const node of nodes) {
    const parts = node.nodeValue.split(/@@(\d+)@@/);
    if (parts.length === 1) continue;
    const frag = document.createDocumentFragment();
    parts.forEach((part, i) => {
      if (i % 2 === 0) { if (part) frag.append(part); } else frag.append(mathNode(math[Number(part)] ?? "@@" + part + "@@"));
    });
    node.replaceWith(frag);
  }
  for (const el of root.querySelectorAll("[alt*='@@'], [title*='@@']")) { // attributes keep the TeX source
    for (const name of ["alt", "title"]) {
      const value = el.getAttribute(name);
      if (value) el.setAttribute(name, value.replace(/@@(\d+)@@/g, (m, n) => math[Number(n)] ?? m));
    }
  }
}

const markdown = window.marked && marked.Marked ? new marked.Marked({gfm: true, breaks: false}) : null;
// Notebook text is not trusted: no scripts, event handlers, forms, styles or frames reach this page.
const PURIFY = {USE_PROFILES: {html: true}, ALLOW_DATA_ATTR: false, FORBID_ATTR: ["autofocus"],
  FORBID_TAGS: ["style", "form", "input", "button", "textarea", "select", "option", "dialog", "template", "slot"]};
let imageCell = "";

function decode(text) {
  try { return decodeURIComponent(text); } catch (e) { return text; }
}

// Images that live on the Jupyter server (attachment:name, or a path next to the notebook) come through the hub.
function imageSource(value) {
  const src = value.trim();
  if (VIEW !== "jupyter" || !src) return value;
  if (/^attachment:/i.test(src)) return "attachment/" + encodeURIComponent(imageCell) + "/" + encodeURIComponent(decode(src.slice(11)));
  if (/^([a-z][a-z0-9+.-]*:|[/#])/i.test(src)) return value;
  return "file?src=" + encodeURIComponent(decode(src.split(/[?#]/)[0]));
}

if (window.DOMPurify) {
  DOMPurify.addHook("uponSanitizeAttribute", (node, data) => {
    if (node.nodeName === "IMG" && data.attrName === "src") data.attrValue = imageSource(data.attrValue);
  });
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.nodeName === "A" && node.hasAttribute("href") && !node.getAttribute("href").startsWith("#")) {
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    } else if (node.nodeName === "IMG") {
      node.setAttribute("loading", "lazy");
    }
  });
}

function markdownFragment(source, cellId) {
  const {text, math} = removeMath(source);
  imageCell = cellId;
  const template = document.createElement("template");
  template.innerHTML = DOMPurify.sanitize(markdown.parse(text), PURIFY);
  restoreMath(template.content, math);
  for (const heading of template.content.querySelectorAll("h1, h2, h3, h4, h5, h6")) {
    if (!heading.id) heading.id = heading.textContent.trim().replace(/\s+/g, "-"); // as JupyterLab does, for #links
  }
  return template.content;
}

function showMarkdown(box, source, cellId) {
  if (!source.trim()) {
    box.innerHTML = '<p class="blank">Empty Markdown cell</p>';
    return;
  }
  if (markdown && window.DOMPurify) {
    try {
      box.replaceChildren(markdownFragment(source, cellId));
      return;
    } catch (error) {
      console.error("Markdown rendering failed", error);
    }
  }
  const pre = document.createElement("pre"); // the libraries did not load: show the source
  pre.className = "fallback";
  pre.textContent = source;
  box.replaceChildren(pre);
}

// ---- Cells and outputs ---------------------------------------------------------------------------
function makeCell(cell) {
  const el = document.createElement("section");
  el.dataset.id = cell.id;
  el.innerHTML = '<div class="body"><div class="badge"><span class="idx"></span><span class="tag"></span>' +
    '<span class="time"></span></div><div class="md"></div><pre class="source"></pre><div class="outputs"></div></div>';
  const entry = {el, cell: cell, source: null, type: null, rev: -1, status: null, tag: null, showSource: false};
  el.addEventListener("dblclick", () => { // double-click a Markdown cell to see its source
    if (entry.type === "code") return;
    entry.showSource = !entry.showSource;
    el.classList.toggle("show-source", entry.showSource);
    window.getSelection()?.removeAllRanges();
  });
  return entry;
}

function renderItem(item, cellId, n) {
  if (item.kind === "image") {
    const img = document.createElement("img");
    img.src = "data:" + item.mime + ";base64," + item.data;
    img.alt = "Output image " + (n + 1) + " of cell " + cellId;
    img.title = "Click to toggle full size";
    img.addEventListener("click", () => img.classList.toggle("full"));
    return img;
  }
  if (item.kind === "html") {
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.title = "HTML output of cell " + cellId;
    frame.dataset.key = cellId + ":" + n;
    const room = Math.max(160, window.innerHeight - 230);
    frame.srcdoc = '<!doctype html><meta charset="utf-8"><style>body{margin:8px;font:14px system-ui,sans-serif}' +
      'img,svg,video,canvas{max-width:100%;max-height:' + room + 'px;width:auto;height:auto;object-fit:contain}' +
      'table{max-width:100%}</style>' +
      item.html + '<script>new ResizeObserver(function(){parent.postMessage({mirrorKey:' +
      JSON.stringify(frame.dataset.key) + ',h:document.documentElement.scrollHeight},"*")}).observe(document.documentElement)<\/script>';
    return frame;
  }
  if (item.kind === "text" && (item.format === "markdown" || item.latex) && markdown) {
    const box = document.createElement("div");
    box.className = "md";
    showMarkdown(box, item.format === "markdown" ? item.text : item.latex, cellId);
    return box;
  }
  const pre = document.createElement("pre");
  if (item.kind === "error") {
    pre.className = "err";
    pre.textContent = item.ename + ": " + item.evalue + (item.traceback ? "\n" + item.traceback : "");
  } else {
    if (item.kind === "stream" && item.name !== "stdout") pre.className = "stderr";
    pre.textContent = item.text;
  }
  return pre;
}

addEventListener("message", (event) => {
  const data = event.data;
  if (!data || !data.mirrorKey) return;
  for (const frame of document.querySelectorAll("iframe")) {
    if (frame.dataset.key === data.mirrorKey && frame.contentWindow === event.source) {
      frame.style.height = Math.min(Math.max(data.h, 40), Math.max(200, window.innerHeight - 70)) + "px";
    }
  }
});

async function loadOutputs(cell, entry) {
  const wanted = cell.rev;
  try {
    const data = await (await fetch("outputs/" + encodeURIComponent(cell.id), {cache: "no-store"})).json();
    const box = entry.el.querySelector(".outputs");
    box.replaceChildren(...data.items.map((item, n) => renderItem(item, cell.id, n)));
    entry.rev = data.rev;
  } catch (e) {
    entry.rev = wanted - 1; // retry on the next tick
  }
}

// ---- Header --------------------------------------------------------------------------------------
function kernelClass(state) {
  if (state === "idle") return "k-idle";
  if (state === "busy" || state === "starting" || state === "restarting") return "k-busy";
  if (state === "dead" || state === "disconnected") return "k-dead";
  return "k-unknown";
}

function renderHeader(state) {
  const server = VIEW === "jupyter" ? state.server || "" : "";
  ui.conn.className = "pill " + (state.connected ? "on" : "off");
  ui.connText.textContent = !state.connected ? "No " + KIND.tab + " connected" :
    server ? "Connected · " + server : KIND.tab + " connected";
  ui.conn.title = state.connected ? "The " + KIND.tab + (server ? " of " + server : "") + " is connected" : ui.connText.textContent;
  ui.connect.hidden = state.connected || !KIND.setup;
  let folder = "", name = "", where = "";
  if (VIEW === "jupyter") {
    const path = state.path || "";
    const slash = path.lastIndexOf("/");
    folder = path.slice(0, slash + 1); // shown before the name, muted
    name = path.slice(slash + 1);
  } else if (state.notebook) {
    name = "Colab notebook";
    where = state.notebook.replace(/^https?:\/\//, "");
  }
  const dir = document.createElement("span");
  dir.className = "dir";
  dir.textContent = folder;
  ui.name.replaceChildren(...(folder ? [dir] : []), name || "No notebook open");
  ui.name.classList.toggle("none", !name);
  ui.name.title = folder + name;
  ui.where.textContent = where;
  ui.where.title = where;
  document.title = name ? name + " · " + BASE_TITLE : BASE_TITLE;
  const kernel = [state.kernel_name, state.kernel_state].filter(Boolean).join(" · ");
  ui.kernel.hidden = !kernel;
  ui.kernel.className = "chip " + kernelClass(state.kernel_state);
  ui.kernelText.textContent = kernel;
  ui.kernel.title = kernel ? "Kernel: " + kernel : "";
  const total = state.cells.length;
  const running = state.cells.filter((c) => c.status === "running").length;
  ui.count.hidden = !total;
  ui.count.firstChild.textContent = total + (total === 1 ? " cell" : " cells") + (running ? " · " + running + " running" : "");
}

function render(state) {
  skew = Date.now() / 1000 - state.now;
  renderHeader(state);
  if (!state.cells.length) {
    known.clear();
    ui.cells.innerHTML = '<p class="empty"></p>';
    ui.cells.firstChild.textContent = state.connected && (state.path || state.notebook) ? "The notebook has no cells." : KIND.empty;
  } else {
    const ids = state.cells.map((c) => c.id);
    for (const id of [...known.keys()]) if (!ids.includes(id)) { known.get(id).el.remove(); known.delete(id); }
    for (const cell of state.cells) if (!known.has(cell.id)) known.set(cell.id, makeCell(cell));
    const current = [...ui.cells.children].map((el) => el.dataset.id);
    if (current.join("\n") !== ids.join("\n")) ui.cells.replaceChildren(...ids.map((id) => known.get(id).el));
    for (const cell of state.cells) {
      const entry = known.get(cell.id);
      const tag = tagOf(cell);
      entry.el.className = "cell " + cell.status + (cell.type === "code" ? "" : " text") +
        (tag === "err" ? " is-err" : "") + (entry.showSource ? " show-source" : "");
      entry.el.querySelector(".idx").textContent = "[" + cell.index + "]";
      if (entry.tag !== tag) {
        const el = entry.el.querySelector(".tag");
        el.className = "tag" + (tag ? " t-" + tag : "");
        el.textContent = tag ? TAGS[tag].text : "";
        entry.tag = tag;
      }
      entry.cell = cell;
      if (entry.source !== cell.source || entry.type !== cell.type) {
        entry.el.querySelector(".source").textContent = cell.source || " ";
        const box = entry.el.querySelector(".md");
        if (cell.type === "code") box.replaceChildren();
        else showMarkdown(box, cell.source || "", cell.id);
        entry.source = cell.source;
        entry.type = cell.type;
        entry.el.querySelector(".badge").title = cell.type === "code" ? "" : "Double-click the cell to show or hide its Markdown source";
      }
      if (entry.status !== cell.status && cell.status === "running" && ui.follow.checked) {
        entry.el.scrollIntoView({block: "center", behavior: "smooth"});
      }
      entry.status = cell.status; entry.started = cell.started; entry.finished = cell.finished;
      if (entry.rev !== cell.rev) { entry.rev = cell.rev; loadOutputs(cell, entry); }
    }
    updateTimers();
  }

  if (state.rev !== lastRev) {
    lastRev = state.rev;
    ui.log.replaceChildren(...state.events.slice().reverse().map((event) => {
      const li = document.createElement("li");
      const time = document.createElement("time");
      time.textContent = new Date(event.t * 1000).toLocaleTimeString();
      li.append(time, event.text);
      return li;
    }));
  }
}

function updateTimers() {
  const now = Date.now() / 1000 - skew;
  for (const entry of known.values()) {
    const seconds = entry.started ? Math.max(0, (entry.finished || now) - entry.started) : null;
    const time = seconds === null || !entry.tag ? "" : short(seconds);
    const timeEl = entry.el.querySelector(".time");
    if (timeEl.textContent !== time) timeEl.textContent = time;
    entry.el.querySelector(".tag").title = entry.tag ? TAGS[entry.tag].tip(seconds === null ? "" : fmt(seconds), entry.cell) : "";
  }
}

async function tick() {
  try {
    render(await (await fetch("state", {cache: "no-store"})).json());
  } catch (e) {
    ui.conn.className = "pill off";
    ui.connText.textContent = ui.conn.title = "Hub not running";
  }
}
tick();
setInterval(tick, 1000);
setInterval(updateTimers, 250);
</script>
</body>
</html>
