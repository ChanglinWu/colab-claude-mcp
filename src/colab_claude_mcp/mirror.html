<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colab mirror</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --line: #dfddd5; --text: #1f1e1b; --muted: #6f6c63;
    --code-bg: #fbfaf7; --accent: #b4540a; --ok: #2f7d4f; --bad: #b3261e; --run: #b4540a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --surface: #1f2024; --line: #33353b; --text: #e8e6e1; --muted: #9a978f;
      --code-bg: #1a1b1f; --accent: #f0a04b; --ok: #6cc08b; --bad: #f2867f; --run: #f0a04b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .on .dot { background: var(--ok); } .off .dot { background: var(--bad); }
  .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
  label.follow { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  a.nav { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  a.nav:hover { text-decoration: underline; }
  main { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  section.cell { scroll-margin-top: 56px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .cell { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
  .gutter { font: 12px var(--mono); color: var(--muted); padding-top: 9px; text-align: right; }
  .gutter .state { display: block; margin-top: 3px; font-family: var(--sans); font-size: 11px; }
  .running .state { color: var(--run); font-weight: 600; }
  .done .state { color: var(--ok); } .error .state, .failed .state { color: var(--bad); font-weight: 600; }
  .body { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .running .body { border-color: var(--run); box-shadow: 0 0 0 1px var(--run); }
  .error .body, .failed .body { border-color: var(--bad); }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
  .source { padding: 9px 12px; background: var(--code-bg); }
  .text .source { background: transparent; font-family: var(--sans); font-size: 14px; }
  .outputs { border-top: 1px solid var(--line); padding: 9px 12px; display: grid; gap: 8px; }
  .outputs:empty { display: none; }
  .outputs pre { max-height: 420px; overflow: auto; }
  .outputs .stderr { color: var(--muted); }
  .outputs .err { color: var(--bad); }
  .outputs img { max-width: 100%; max-height: calc(100vh - 90px); width: auto; height: auto; object-fit: contain;
    background: #fff; border-radius: 4px; display: block; cursor: zoom-in; }
  .outputs img.full { max-height: none; cursor: zoom-out; }
  .outputs iframe { width: 100%; height: 120px; border: 0; background: #fff; border-radius: 4px; display: block; }
  details { max-width: 980px; margin: 0 auto 30px; padding: 0 16px; color: var(--muted); font-size: 12px; }
  summary { cursor: pointer; padding: 6px 0; }
  #log { font: 12px/1.6 var(--mono); margin: 0; padding: 0; list-style: none; }
  #log time { margin-right: 8px; }
  @media (max-width: 560px) { .cell { grid-template-columns: 1fr; gap: 2px; } .gutter { text-align: left; padding-top: 0; }
    .gutter .state { display: inline; margin-left: 8px; } }
  @media (prefers-reduced-motion: no-preference) {
    .running .state::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--run); margin-right: 5px; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  }
</style>
</head>
<body>
<header>
  <h1>Colab mirror</h1>
  <span id="conn" class="pill off"><span class="dot"></span><span id="conn-text">Connecting…</span></span>
  <span id="meta" class="meta"></span>
  <label class="follow"><input id="follow" type="checkbox" checked> Follow running cell</label>
  <a class="nav" href="/matlab">MATLAB output</a>
</header>
<main id="cells"><p class="empty">Waiting for the hub…</p></main>
<details><summary>Activity</summary><ul id="log"></ul></details>
<script>
const cellsEl = document.getElementById("cells");
const known = new Map(); // id -> {el, source, rev, status, started, finished}
let skew = 0, lastRev = -1, lastState = null;
const LABELS = {idle: "", has_output: "has output", running: "running", done: "done", error: "error", failed: "failed"};

function fmt(seconds) {
  if (seconds < 60) return seconds.toFixed(seconds < 10 ? 1 : 0) + " s";
  return Math.floor(seconds / 60) + " min " + Math.round(seconds % 60) + " s";
}

function makeCell(cell) {
  const el = document.createElement("section");
  el.dataset.id = cell.id;
  el.innerHTML = '<div class="gutter"><span class="idx"></span><span class="state"></span></div>' +
    '<div class="body"><pre class="source"></pre><div class="outputs"></div></div>';
  return {el, source: null, rev: -1, status: null};
}

function renderItem(item, cellId, n) {
  if (item.kind === "image") {
    const img = document.createElement("img");
    img.src = "data:" + item.mime + ";base64," + item.data;
    img.alt = "Output image " + (n + 1) + " of cell " + cellId;
    img.title = "Click to toggle full size";
    img.addEventListener("click", () => img.classList.toggle("full"));
    return img;
  }
  if (item.kind === "html") {
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.title = "HTML output of cell " + cellId;
    frame.dataset.key = cellId + ":" + n;
    const room = Math.max(160, window.innerHeight - 230);
    frame.srcdoc = '<!doctype html><meta charset="utf-8"><style>body{margin:8px;font:14px system-ui,sans-serif}' +
      'img,svg,video,canvas{max-width:100%;max-height:' + room + 'px;width:auto;height:auto;object-fit:contain}' +
      'table{max-width:100%}</style>' +
      item.html + '<script>new ResizeObserver(function(){parent.postMessage({mirrorKey:' +
      JSON.stringify(frame.dataset.key) + ',h:document.documentElement.scrollHeight},"*")}).observe(document.documentElement)<\/script>';
    return frame;
  }
  const pre = document.createElement("pre");
  if (item.kind === "error") {
    pre.className = "err";
    pre.textContent = item.ename + ": " + item.evalue + (item.traceback ? "\n" + item.traceback : "");
  } else {
    if (item.kind === "stream" && item.name !== "stdout") pre.className = "stderr";
    pre.textContent = item.text;
  }
  return pre;
}

addEventListener("message", (event) => {
  const data = event.data;
  if (!data || !data.mirrorKey) return;
  for (const frame of document.querySelectorAll("iframe")) {
    if (frame.dataset.key === data.mirrorKey && frame.contentWindow === event.source) {
      frame.style.height = Math.min(Math.max(data.h, 40), Math.max(200, window.innerHeight - 70)) + "px";
    }
  }
});

async function loadOutputs(cell, entry) {
  const wanted = cell.rev;
  try {
    const data = await (await fetch("/outputs/" + encodeURIComponent(cell.id), {cache: "no-store"})).json();
    const box = entry.el.querySelector(".outputs");
    box.replaceChildren(...data.items.map((item, n) => renderItem(item, cell.id, n)));
    entry.rev = data.rev;
  } catch (e) {
    entry.rev = wanted - 1; // retry on the next tick
  }
}

function render(state) {
  lastState = state;
  skew = Date.now() / 1000 - state.now;
  const conn = document.getElementById("conn");
  conn.className = "pill " + (state.connected ? "on" : "off");
  document.getElementById("conn-text").textContent = state.connected ? "Colab tab connected" : "No Colab tab connected";
  const running = state.cells.filter((c) => c.status === "running").length;
  document.getElementById("meta").textContent = [
    state.notebook || "", state.cells.length + (state.cells.length === 1 ? " cell" : " cells"),
    running ? running + " running" : ""].filter(Boolean).join(" · ");

  if (!state.cells.length) {
    known.clear();
    cellsEl.innerHTML = '<p class="empty">' + (state.connected ? "The notebook has no cells." :
      "No notebook yet. Ask Claude to connect to Colab.") + "</p>";
  } else {
    const ids = state.cells.map((c) => c.id);
    for (const id of [...known.keys()]) if (!ids.includes(id)) { known.get(id).el.remove(); known.delete(id); }
    for (const cell of state.cells) if (!known.has(cell.id)) known.set(cell.id, makeCell(cell));
    const current = [...cellsEl.children].map((el) => el.dataset.id);
    if (current.join("\n") !== ids.join("\n")) cellsEl.replaceChildren(...ids.map((id) => known.get(id).el));
    for (const cell of state.cells) {
      const entry = known.get(cell.id);
      entry.el.className = "cell " + cell.status + (cell.type === "code" ? "" : " text");
      entry.el.querySelector(".idx").textContent = "[" + cell.index + "]";
      if (entry.source !== cell.source) {
        entry.el.querySelector(".source").textContent = cell.source || " ";
        entry.source = cell.source;
      }
      if (entry.status !== cell.status && cell.status === "running" && document.getElementById("follow").checked) {
        entry.el.scrollIntoView({block: "center", behavior: "smooth"});
      }
      entry.status = cell.status; entry.started = cell.started; entry.finished = cell.finished;
      if (entry.rev !== cell.rev) { entry.rev = cell.rev; loadOutputs(cell, entry); }
    }
    updateTimers();
  }

  if (state.rev !== lastRev) {
    lastRev = state.rev;
    document.getElementById("log").replaceChildren(...state.events.slice().reverse().map((event) => {
      const li = document.createElement("li");
      const time = document.createElement("time");
      time.textContent = new Date(event.t * 1000).toLocaleTimeString();
      li.append(time, event.text);
      return li;
    }));
  }
}

function updateTimers() {
  const now = Date.now() / 1000 - skew;
  for (const entry of known.values()) {
    let label = LABELS[entry.status] || "";
    if (entry.started) label += " " + fmt((entry.finished || now) - entry.started);
    entry.el.querySelector(".state").textContent = label.trim();
  }
}

async function tick() {
  try {
    render(await (await fetch("/state", {cache: "no-store"})).json());
  } catch (e) {
    document.getElementById("conn").className = "pill off";
    document.getElementById("conn-text").textContent = "Hub not running";
  }
}
tick();
setInterval(tick, 1000);
setInterval(updateTimers, 250);
</script>
</body>
</html>
